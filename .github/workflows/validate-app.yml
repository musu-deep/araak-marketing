name: Validate App

on:
  push:
    branches:
      - main
      - agent/task-scheduling-executive-management
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: TypeScript check
        id: typecheck
        continue-on-error: true
        shell: bash
        run: npm run typecheck > typecheck.log 2>&1

      - name: Build application
        id: build
        continue-on-error: true
        shell: bash
        run: npm run build > build.log 2>&1

      - name: Upload validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-logs
          path: |
            typecheck.log
            build.log
          if-no-files-found: error
          retention-days: 7

      - name: Fail when validation fails
        if: steps.typecheck.outcome == 'failure' || steps.build.outcome == 'failure'
        run: exit 1
